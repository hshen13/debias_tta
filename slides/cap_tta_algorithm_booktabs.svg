<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="860px" version="1.1" width="1680px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="860" width="1680" x="0" y="0" /><line stroke="black" stroke-linecap="butt" stroke-width="2.8" x1="46" x2="1634" y1="34" y2="34" /><text fill="black" font-family="Times New Roman, Times, serif" font-size="28" font-style="normal" font-weight="bold" text-anchor="start" x="46" y="72">Algorithm 1</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="28" font-style="normal" font-weight="normal" text-anchor="start" x="241" y="72">CAP-TTA: Thresholded Preconditioned Test-Time Adaptation</text><line stroke="black" stroke-linecap="butt" stroke-width="1.5" x1="46" x2="1634" y1="98" y2="98" /><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="140" y="144">REQUIRE</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="285" y="144">  Prompt x; model p_{θ,φ} with φ ← φ₀; detector b(·); trigger threshold τ_trig; segments K;</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="140" y="188">         safe data source 𝒟_safe(·); preconditioner P₀; step size α; (optional) clip c.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="140" y="232">ENSURE</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="270" y="232">   Generated narrative y = (y^(1), …, y^(K)).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="276">1</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="140" y="276">Initialize history h₁ ← x.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="320">2</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="140" y="320">for</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="182" y="320"> k = 1 to K do</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="364">3</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="192" y="364">Generate segment y^(k) ∼ p_{θ,φ}(· | h_k).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="408">4</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="192" y="408">Compute bias score s_k ← b(y^(k)).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="452">5</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="192" y="452">if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="220" y="452"> s_k &gt; τ_trig then</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="496">6</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="244" y="496">Sample a batch {s_j}_{j=1}^m ∼ 𝒟_safe(h_k).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="540">7</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="244" y="540">Form context-aligned texts s̃_j ← concat(h_k, s_j).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="584">8</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="244" y="584">Compute gradient:</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="628">9</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="244" y="628">g ← ∇_φ (1/m) Σ_{j=1}^m [ − log p_{θ,φ}(s̃_j | h_k) ].</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="672">10</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="244" y="672">if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="272" y="672"> gradient clipping is used then</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="716">11</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="296" y="716">g ← g · min{1, c / ||g||₂}.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="760">12</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="244" y="760">end if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="804">13</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="244" y="804">Preconditioned update: φ ← φ − α P₀ g.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="848">14</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="192" y="848">end if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="892">15</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="192" y="892">Update history h_{k+1} ← (h_k, y^(k)).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="936">16</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="140" y="936">end for</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="26" font-style="normal" font-weight="normal" text-anchor="end" x="82" y="980">17</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="140" y="980">return</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="27" font-style="normal" font-weight="normal" text-anchor="start" x="226" y="980"> y = (y^(1), …, y^(K)).</text><line stroke="black" stroke-linecap="butt" stroke-width="2.8" x1="46" x2="1634" y1="1006" y2="1006" /></svg>
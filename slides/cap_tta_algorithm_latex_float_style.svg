<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="730px" version="1.1" width="1180px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="730" width="1180" x="0" y="0" /><line stroke="black" stroke-linecap="butt" stroke-width="1.4" x1="42.0" x2="1138.0" y1="24.0" y2="24.0" /><text fill="black" font-family="Times New Roman, Times, serif" font-size="18.0" font-style="normal" font-weight="bold" text-anchor="start" x="42.0" y="49.0">Algorithm 1</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="18.0" font-style="normal" font-weight="normal" text-anchor="start" x="146.0" y="49.0">CAP-TTA: Thresholded Preconditioned Test-Time Adaptation</text><line stroke="black" stroke-linecap="butt" stroke-width="0.9" x1="42.0" x2="1138.0" y1="67.0" y2="67.0" /><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="104.0" y="104.0">Require:</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="165.6" y="104.0"> Prompt x; model pθ,φ with φ ← φ0; detector b(·); trigger threshold τtrig; segments K;</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="104.0" y="132.0">safe data source Dsafe(·); preconditioner P0; step size α; (optional) clip c.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="104.0" y="160.0">Ensure:</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="157.9" y="160.0"> Generated narrative y = (y(1), …, y(K)).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="188.0">1</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="104.0" y="188.0">Initialize history h1 ← x.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="216.0">2</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="104.0" y="216.0">for</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="127.1" y="216.0"> k = 1 to K do</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="244.0">3</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="138.0" y="244.0">Generate segment y(k) ∼ pθ,φ(· | hk).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="272.0">4</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="138.0" y="272.0">Compute bias score sk ← b(y(k)).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="300.0">5</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="138.0" y="300.0">if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="153.4" y="300.0"> sk &gt; τtrig then</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="328.0">6</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="172.0" y="328.0">Sample a batch {sj}j=1m ∼ Dsafe(hk).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="356.0">7</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="172.0" y="356.0">Form context-aligned texts s̃j ← concat(hk, sj).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="384.0">8</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="172.0" y="384.0">Compute gradient:</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="412.0">9</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="172.0" y="412.0">g ← ∇φ 1/m Σj=1m [−log pθ,φ(s̃j | hk)].</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="440.0">10</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="172.0" y="440.0">if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="187.4" y="440.0"> gradient clipping is used then</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="468.0">11</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="206.0" y="468.0">g ← g · min{1, c/∥g∥2}.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="496.0">12</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="172.0" y="496.0">end</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="195.1" y="496.0"> if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="524.0">13</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="172.0" y="524.0">Preconditioned update: φ ← φ − α P0 g.</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="552.0">14</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="138.0" y="552.0">end</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="161.1" y="552.0"> if</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="580.0">15</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="138.0" y="580.0">Update history hk+1 ← (hk, y(k)).</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="608.0">16</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="104.0" y="608.0">end</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="127.1" y="608.0"> for</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="end" x="73.0" y="636.0">17</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="bold" text-anchor="start" x="104.0" y="636.0">return</text><text fill="black" font-family="Times New Roman, Times, serif" font-size="16.0" font-style="normal" font-weight="normal" text-anchor="start" x="150.2" y="636.0"> y = (y(1), …, y(K)).</text><line stroke="black" stroke-linecap="butt" stroke-width="1.4" x1="42.0" x2="1138.0" y1="672.0" y2="672.0" /></svg>